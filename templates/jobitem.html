<div class="mb-4 border-bottom row padding-bottom-4">
  <div class="col-11">
    <h4 >{{ job.title }}</h4>
    <div>
      <b>Location: {{ job.location }}</b>
    </div>
    {% if 'salary' in job %}
      <div>
        Salary: {{job.salary}}
      </div>
    {% endif %}
  </div>
  <div class="col-1">
    <button class="btn btn-outline-primary">
      Apply
    </button>
</div>
</div>
